<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mon Potager Breton</title>
<meta name="theme-color" content="#26331f">
<meta name="description" content="Suivi de potager, plan des parcelles et conseils adaptés au climat breton.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Potager">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="entete">
  <div class="entete-contenu">
    <div class="entete-titre">
      <span class="pousse" aria-hidden="true">🌱</span>
      <div>
        <h1>Mon Potager Breton</h1>
        <div class="sous-titre"><span id="date-du-jour"></span> <span class="badge-saison" id="badge-saison"></span></div>
      </div>
    </div>
    <button class="btn-reglages" data-vue="reglages" aria-label="Réglages">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg>
    </button>
  </div>
  <svg class="entete-horizon" viewBox="0 0 880 26" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,26 L0,14 Q110,2 220,13 T440,10 T660,15 T880,8 L880,26 Z"></path>
  </svg>
</header>

<nav class="onglets" aria-label="Sections">
  <button data-vue="accueil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-4v-5H9v5H5a1 1 0 0 1-1-1z"/></svg>
    <span>Accueil</span>
  </button>
  <button data-vue="plan">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4" width="17" height="4" rx="1"/><rect x="3.5" y="11" width="11" height="4" rx="1"/><rect x="17" y="11" width="3.5" height="9" rx="1"/><rect x="3.5" y="18" width="11" height="2" rx="1"/></svg>
    <span>Plan</span>
  </button>
  <button data-vue="cultures">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12c0-4 3-6 7-6 0 4-3 6-7 6z"/><path d="M12 14c0-3-2.5-5-6-5 0 3 2.5 5 6 5z"/></svg>
    <span>Cultures</span>
  </button>
  <button data-vue="saisons">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    <span>Saisons</span>
  </button>
  <button data-vue="journal">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h11a1.5 1.5 0 0 1 1.5 1.5v14a1.5 1.5 0 0 1-1.5 1.5H6z"/><path d="M6 3.5v17M9.5 8h5.5M9.5 11.5h5.5"/></svg>
    <span>Journal</span>
  </button>
</nav>

<main>
  <section id="vue-accueil" class="vue"></section>
  <section id="vue-plan" class="vue"></section>
  <section id="vue-cultures" class="vue"></section>
  <section id="vue-saisons" class="vue"></section>
  <section id="vue-journal" class="vue"></section>
  <section id="vue-reglages" class="vue"></section>
</main>

<footer class="pied-page">
  Données conservées uniquement sur cet appareil. Repères de semis et récolte pensés pour le climat breton, à ajuster selon ta météo réelle.
</footer>

<dialog id="fenetre" aria-label="Détail">
  <div class="fenetre-poignee" aria-hidden="true"></div>
  <div class="fenetre-contenu"></div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/plants-data.js"></script>
<script src="js/app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").then(reg => {
        // Une nouvelle version a été installée : on prévient l'utilisateur
        reg.addEventListener("updatefound", () => {
          const nouveau = reg.installing;
          if (!nouveau) return;
          nouveau.addEventListener("statechange", () => {
            if (nouveau.state === "activated" && navigator.serviceWorker.controller) {
              const t = document.getElementById("toast");
              t.innerHTML = '<span>Nouvelle version de l\'appli installée.</span><button type="button">Recharger</button>';
              t.classList.add("visible");
              t.querySelector("button").addEventListener("click", () => location.reload());
            }
          });
        });
      }).catch(err => console.warn("Service worker non enregistré :", err));
    });
  }
</script>
</body>
</html>
